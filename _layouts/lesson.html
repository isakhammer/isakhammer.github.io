<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }} | Skole</title>
  <meta name="description" content="{{ page.description | escape }}">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: #17212b;
      background: #f4f6f8;
      font: 16px/1.7 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(760px, calc(100% - 32px)); margin: 0 auto; padding: 36px 0 64px; }
    nav { margin-bottom: 28px; font-size: 0.95rem; }
    a { color: #075e67; }
    h1, h2, h3 { line-height: 1.25; }
    h1 { margin: 0 0 12px; font-size: 2.4rem; }
    h2 { margin-top: 2em; }
    p, li { max-width: 70ch; }
    .description { margin: 0 0 32px; color: #53616c; }
    .content { padding-top: 8px; border-top: 1px solid #d6dde1; }
    .content img { max-width: 100%; height: auto; }
    .content pre { overflow-x: auto; padding: 16px; background: #e9eef0; border-radius: 6px; }
    .content code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .content :not(pre) > code { padding: 2px 5px; background: #e9eef0; border-radius: 4px; }
    @media (max-width: 600px) {
      main { padding-top: 24px; }
      h1 { font-size: 2rem; }
    }
  </style>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] } };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>
  <main>
    <nav><a href="/education/">Skole</a> / <a href="/education/naturfag/">Naturfag</a> / <a href="/education/naturfag/oppgavesett/">Oppgavesett</a></nav>
    <article>
      <h1>{{ page.title | escape }}</h1>
      {% if page.description %}<p class="description">{{ page.description | escape }}</p>{% endif %}
      <div class="content">
        {{ content }}
      </div>
    </article>
  </main>
</body>
</html>
