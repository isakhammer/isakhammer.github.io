<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skole</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
      color: #111827;
      background: #f4f6f8;
    }

    main {
      width: min(900px, calc(100% - 32px));
      margin: 0 auto;
      padding: 48px 0;
    }

    header {
      margin-bottom: 32px;
    }

    .home-link {
      color: #4b5563;
      font-size: 0.95rem;
      text-decoration: none;
    }

    .home-link:hover {
      color: #111827;
      text-decoration: underline;
    }

    h1 {
      margin: 16px 0 8px;
      font-size: clamp(2rem, 5vw, 3.25rem);
      line-height: 1.1;
    }

    p {
      max-width: 62ch;
      margin: 0;
      color: #4b5563;
    }

    .subjects {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .subject {
      display: block;
      min-height: 180px;
      padding: 24px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      color: inherit;
      background: #ffffff;
      text-decoration: none;
      transition: border-color 150ms ease, box-shadow 150ms ease, transform 150ms ease;
    }

    .subject:hover {
      border-color: #111827;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.12);
      transform: translateY(-2px);
    }

    .subject span {
      display: inline-block;
      margin-bottom: 18px;
      color: #6b7280;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .subject h2 {
      margin: 0 0 10px;
      font-size: 1.5rem;
      line-height: 1.2;
    }

    .subject p {
      color: #4b5563;
    }

    @media (max-width: 680px) {
      main {
        padding: 32px 0;
      }

      .subjects {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <a class="home-link" href="../index.html">Tilbake til forsiden</a>
      <h1>Skole</h1>
      <p>Fagstoff og undervisningsressurser samlet etter fag.</p>
    </header>

    <section class="subjects" aria-label="Fag">
      <a class="subject" href="naturfag/">
        <span>Fag</span>
        <h2>Naturfag</h2>
        <p>Simuleringer, presentasjoner og annet undervisningsstoff.</p>
      </a>

      <a class="subject" href="matematikk/">
        <span>Fag</span>
        <h2>Matematikk</h2>
        <p>En egen mappe for matematikkressurser.</p>
      </a>
    </section>
  </main>
</body>
</html>
